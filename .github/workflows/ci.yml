name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No dependencies needed — auth, scoring, cluster engine, tutor layer
      # and the generated-avatar module.
      - name: Unit tests and HTML/JS checks
        run: npm test

      # Guards against supabase/seed.sql drifting from assets/js/data.js.
      - name: Reference data is in sync
        run: |
          npm run seed
          git diff --exit-code supabase/seed.sql

  # Renders every page in jsdom and executes its scripts, catching renamed
  # functions and missing element IDs that static checks cannot see.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:render

  # Loads every page in real Chromium at phone sizes and fails on sideways
  # scrolling, tap targets under 44x44, text under 12px, clipped text and
  # controls hidden behind the fixed bars.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Start the site
        run: (python3 -m http.server 8000 &) && sleep 2
      # Prove the UI actually works: every link resolves, every button
      # responds, nothing throws when clicked.
      - name: Click every button, resolve every link
        run: npx --no-install node tools/interaction_audit.js

      - name: 360 x 640 (the target portrait viewport)
        run: npx --no-install node tools/mobile_audit.js 360 640
      - name: 320 x 700 (smallest phone still in use)
        run: npx --no-install node tools/mobile_audit.js 320 700
      - name: 414 x 736 (large phone)
        run: npx --no-install node tools/mobile_audit.js 414 736
      # Landscape is a separate failure mode: a 740x360 phone is WIDER than
      # the 640px breakpoint, so width-only rules never reach it.
      - name: 740 x 360 (phone in landscape)
        run: npx --no-install node tools/mobile_audit.js 740 360
      - name: 667 x 375 (small phone in landscape)
        run: npx --no-install node tools/mobile_audit.js 667 375
      # Drawers and modals only exist while open, so the page audit cannot
      # see them.
      - name: Drawers and modals, portrait and landscape
        run: |
          npx --no-install node tools/overlay_audit.js 360 640
          npx --no-install node tools/overlay_audit.js 740 360

  # "Nothing overflows" is a low bar — a page can pass and still be cramped.
  # This job measures reading comfort, spacing density and alignment. It
  # reports findings without failing the build, so it can improve gradually.
  comfort:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Start the site
        run: (python3 -m http.server 8000 &) && sleep 2
      - run: npx --no-install node tools/comfort_audit.js 360 640
      - run: npx --no-install node tools/comfort_audit.js 740 360
