name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, static audit, seed sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The unit suite and the HTML audit are dependency-free on purpose.
      - name: Unit tests
        run: node tests/app.test.js

      - name: Static audit of every page
        run: python3 tools/check_html.py

      - name: Supabase schema audit
        run: python3 tools/check_sql.py

      - name: seed.sql is generated and in sync
        run: |
          node tools/gen_seed.mjs
          git diff --exit-code -- supabase/seed.sql \
            || { echo "::error::supabase/seed.sql is stale — run 'npm run seed' and commit the result"; exit 1; }

      - name: Syntax check every module
        run: |
          for f in assets/js/*.js assets/js/pages/*.js tests/*.js tools/*.js tools/*.mjs sw.js; do
            node --check "$f" || exit 1
          done

      - name: Render every page in jsdom
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node tools/render_check.js

      - name: Click sweep of every page
        run: node tools/click_check.js

      - name: Admin console behaviour
        run: node tests/admin.test.js

      - name: Notifications and charts
        run: node tests/ui.test.js

      - name: Role capabilities
        run: node tests/roles.test.js

      - name: Structured data and manifest parse
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          json.loads(pathlib.Path("manifest.json").read_text())
          json.loads(pathlib.Path("package.json").read_text())
          ET.parse("sitemap.xml")
          print("json + xml ok")
          PY
